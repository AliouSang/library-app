<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library App</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
  </head>
  <body>
      <h1>Library</h1> 
    <div class="container">
      <table>
        <thead>
          <tr>
            <th>Author</th>
            <th>Title</th>
            <th>Pages</th>
            <th>Read</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <button class="button show-modal" command="show-modal" commandfor="dialog">Add New Book</button>
      <dialog id="dialog">
        <button class="button close-modal" commandfor="dialog" command="close">CLOSE</button>

        <p>Fill in all the required (*) fields</p>
        <form method="dialog">
          <div>
            <label for="author">Author: *</label>
            <input required autofocus type="text" id="author" name="author">
          </div>
          <div>
            <label for="title">Title: *</label>
            <input required type="text" id="title" name="title">
          </div>
          <div>
            <label for="pages">Pages: *</label>
            <input required type="number" id="pages" name="pages">
          </div>
          <div>
            <input class="button submit-btn" type="submit" value="SUBMIT">
          </div>
        </form>
      </dialog>
    </div>
  </body>
</html>
